[package]
name = "http-tls-ffi"
version = "1.3.1"
edition = "2021"
description = "Standalone C-ABI shared library (http_tls.dll / libhttp_tls.so / libhttp_tls.dylib) for BoringSSL TLS, HTTP/2, HTTP/3, Real ECH, DoH & Rust Extraction"
license = "MIT"

[lib]
name = "http_tls"
crate-type = ["cdylib"]

[dependencies]
http_tls_core = { package = "http_tls", path = "..", default-features = false, features = ["ffi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
