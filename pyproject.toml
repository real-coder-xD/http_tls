[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "http-tls"
version = "0.6.1"
description = "Standalone Rust + BoringSSL TLS (JA3/JA4) & HTTP/2 Browser Impersonating HTTP client for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
curl_cffi = ["curl_cffi>=0.17"]
impersonate = []
test = ["pytest>=8.0", "cryptography>=42.0", "certifi"]

[project.urls]
Homepage = "https://github.com/real-coder-xD/http_tls"
Issues = "https://github.com/real-coder-xD/http_tls/issues"

[tool.maturin]
python-source = "python"
module-name = "http_tls._core"
features = ["pyo3/extension-module"]
strip = true
opt-level = 3
