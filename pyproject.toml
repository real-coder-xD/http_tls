[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "http-tls"
version = "1.3.0"
description = "Standalone Rust + Pure BoringSSL TLS (JA3/JA4), HTTP/2 & UDP QUIC HTTP/3 (Real ECH, DoH, SOCKS5 UDP) HTTP Client & HTML5 CSS3/XPath/JSON Extraction Engine for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "http",
    "http2",
    "http3",
    "quic",
    "ech",
    "encrypted-client-hello",
    "doh",
    "dns-over-https",
    "socks5",
    "tls",
    "ja3",
    "ja4",
    "boringssl",
    "impersonate",
    "browser-impersonation",
    "tls-fingerprint",
    "anti-bot",
    "cloudflare",
    "rust",
    "pyo3",
    "tokio",
    "requests",
    "httpx",
    "curl-cffi",
    "websocket",
    "web-scraping",
    "scraping",
    "html-parser",
    "html5ever",
    "css-selector",
    "xpath",
    "jsonpath",
    "beautifulsoup-alternative",
    "parsel-alternative",
    "async",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
http-tls = "http_tls.cli:main"

[project.optional-dependencies]
curl_cffi = ["curl_cffi>=0.17"]
impersonate = []
test = ["pytest>=8.0", "cryptography>=42.0", "certifi"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/real-coder-xD/http_tls"
Repository = "https://github.com/real-coder-xD/http_tls"
Documentation = "https://github.com/real-coder-xD/http_tls#readme"
Changelog = "https://github.com/real-coder-xD/http_tls/blob/main/CHANGELOG.md"
Issues = "https://github.com/real-coder-xD/http_tls/issues"

[tool.maturin]
python-source = "python"
module-name = "http_tls._core"
features = ["pyo3/extension-module"]
strip = true
opt-level = 3

[tool.pyrefly]
search-path = ["python"]
