[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "http-tls"
version = "0.3.0"
description = "High-performance Rust-powered TLS & Browser Impersonating HTTP client for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
# Byte-exact browser TLS/HTTP2 fingerprints via libcurl-impersonate.
impersonate = ["curl_cffi>=0.17"]

[project.urls]
Homepage = "https://github.com/real-coder-xD/http_tls"
Issues = "https://github.com/real-coder-xD/http_tls/issues"

[tool.maturin]
python-source = "python"
module-name = "http_tls._core"
features = ["pyo3/extension-module"]
strip = true
opt-level = 3
