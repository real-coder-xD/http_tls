name: CI & Release Wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    name: Static Quality Gates (Clippy + Typing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up latest stable Rust + Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux BoringSSL build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl clang libclang-dev ninja-build

      - name: Run cargo clippy (Python + standalone FFI)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --features ffi -- -D warnings
          cargo clippy --manifest-path ffi/Cargo.toml --target-dir target -- -D warnings
          cargo test --no-default-features --features ffi --lib

      - name: Verify Python syntax & stub typing (mypy)
        run: |
          python -m pip install --upgrade pip mypy
          python -m compileall -q python/ tests/ benchmarks/
          mypy --ignore-missing-imports python/http_tls/__init__.pyi

  build-wheels:
    name: Build & Test Wheels on ${{ matrix.os }} (${{ matrix.label || matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC + BoringSSL)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
            test_pythons: '3.12'
          # Linux x86_64 (AlmaLinux 8 manylinux_2_28 + BoringSSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
            run_tests: true
            test_pythons: '3.9,3.12,3.14'
          # Linux aarch64 (native ARM64 runner + manylinux_2_28 + BoringSSL)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
            run_tests: true
            test_pythons: '3.12'
          # macOS Apple Silicon + Intel (single runner: avoids 4-way macOS runner contention)
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            extra_target: x86_64-apple-darwin
            label: aarch64 + x86_64
            run_tests: true
            test_pythons: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up latest stable Rust (MSRV >= 1.98 for wreq)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - name: Install Windows BoringSSL build deps (NASM + LLVM)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm llvm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
          before-script-linux: |
            set -e
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y \
                --setopt=fastestmirror=True \
                --setopt=max_parallel_downloads=10 \
                --setopt=minrate=500000 \
                --setopt=timeout=15 \
                --setopt=install_weak_deps=False \
                cmake perl-core clang clang-devel clang-libs llvm-devel git ninja-build
            elif command -v yum >/dev/null 2>&1; then
              yum install -y cmake perl-core clang clang-devel clang-libs llvm-devel git
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y cmake perl clang libclang-dev git ninja-build
            fi
            rustup update stable
            rustup default stable
            rustc --version

      - name: Run pytest test suite against built ABI3 wheel (Python 3.12)
        if: ${{ matrix.run_tests }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cryptography certifi
          python -m pip install dist/*.whl
          python -m pytest -v tests/

      - name: Build extra cross-compiled wheel (${{ matrix.extra_target }})
        if: ${{ matrix.extra_target != '' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.extra_target }}
          args: --release --out dist

      - name: Verify ABI3 wheel compatibility on Python 3.13
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run pytest on Python 3.13
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest cryptography certifi
          python -m pip install dist/*.whl
          python -m pytest -v tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-capi:
    name: Build & Test C-ABI Shared Library (${{ matrix.label || matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            src_lib: http_tls.dll
            artifact_name: http_tls-windows-x86_64.dll
            manylinux_image: ''
            run_tests: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            src_lib: libhttp_tls.so
            artifact_name: libhttp_tls-linux-x86_64.so
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            run_tests: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            src_lib: libhttp_tls.so
            artifact_name: libhttp_tls-linux-aarch64.so
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            run_tests: true
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            extra_target: x86_64-apple-darwin
            extra_artifact_name: libhttp_tls-macos-x86_64.dylib
            src_lib: libhttp_tls.dylib
            artifact_name: libhttp_tls-macos-aarch64.dylib
            label: libhttp_tls-macos-aarch64 + x86_64
            manylinux_image: ''
            run_tests: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for ctypes FFI test runner)
        if: ${{ matrix.run_tests && matrix.manylinux_image == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up latest stable Rust (non-container builds)
        if: ${{ matrix.manylinux_image == '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - name: Install Windows BoringSSL build deps (NASM + LLVM)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm llvm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & test Linux C-ABI inside manylinux_2_28 (glibc 2.28 portability)
        if: ${{ matrix.manylinux_image != '' }}
        shell: bash
        run: |
          mkdir -p capi-dist
          docker run --rm \
            -v "$PWD:/io" \
            -w /io \
            "${{ matrix.manylinux_image }}" \
            bash -euo pipefail -c '
              dnf install -y \
                --setopt=fastestmirror=True \
                --setopt=max_parallel_downloads=10 \
                --setopt=minrate=500000 \
                --setopt=timeout=15 \
                --setopt=install_weak_deps=False \
                cmake perl-core clang clang-devel clang-libs llvm-devel git ninja-build
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo build --release --manifest-path ffi/Cargo.toml --target ${{ matrix.target }} --target-dir target
              cp "target/${{ matrix.target }}/release/${{ matrix.src_lib }}" "capi-dist/${{ matrix.artifact_name }}"
              ! ldd "capi-dist/${{ matrix.artifact_name }}" | grep -i python
              /opt/python/cp312-cp312/bin/python -m pip install --upgrade pip pytest
              HTTP_TLS_FFI_LIB="capi-dist/${{ matrix.artifact_name }}" /opt/python/cp312-cp312/bin/python -m pytest -v tests/test_ffi_capi.py
            '

      - name: Build standalone C-ABI shared library (Windows / macOS)
        if: ${{ matrix.manylinux_image == '' }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          mkdir -p capi-dist
          cargo build --release --manifest-path ffi/Cargo.toml --target ${{ matrix.target }} --target-dir target
          cp "target/${{ matrix.target }}/release/${{ matrix.src_lib }}" "capi-dist/${{ matrix.artifact_name }}"
          if [ -f "target/${{ matrix.target }}/release/http_tls.dll.lib" ]; then
            cp "target/${{ matrix.target }}/release/http_tls.dll.lib" "capi-dist/http_tls-windows-x86_64.dll.lib"
          fi
          if [ "$(uname -s)" = "Darwin" ]; then
            ! otool -L "capi-dist/${{ matrix.artifact_name }}" | grep -i python
          fi
          if [ -n "${{ matrix.extra_target }}" ]; then
            cargo build --release --manifest-path ffi/Cargo.toml --target "${{ matrix.extra_target }}" --target-dir target
            cp "target/${{ matrix.extra_target }}/release/${{ matrix.src_lib }}" "capi-dist/${{ matrix.extra_artifact_name }}"
            if [ "$(uname -s)" = "Darwin" ]; then
              ! otool -L "capi-dist/${{ matrix.extra_artifact_name }}" | grep -i python
            fi
          fi

      - name: Run C-ABI FFI test suite (Windows / macOS)
        if: ${{ matrix.run_tests && matrix.manylinux_image == '' }}
        shell: bash
        env:
          HTTP_TLS_FFI_LIB: capi-dist/${{ matrix.artifact_name }}
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -v tests/test_ffi_capi.py

      - name: Upload C-ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-${{ matrix.target }}
          path: capi-dist

  build-sdist:
    name: Build Source Distribution (sdist)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Publish to PyPI & GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheels, build-capi, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: pypi-dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: pypi-dist

      - uses: actions/download-artifact@v4
        with:
          pattern: capi-*
          path: capi-dist
          merge-multiple: true

      - name: Stage C header alongside C-ABI binaries
        run: cp include/http_tls.h capi-dist/http_tls.h

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pypi-dist/*
            capi-dist/*
          generate_release_notes: true
