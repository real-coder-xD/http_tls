name: CI & Release Wheels

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    name: Static Quality Gates (Clippy + Typing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up latest stable Rust + Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux BoringSSL build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl clang libclang-dev ninja-build

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify Python syntax & stub typing (mypy)
        run: |
          python -m pip install --upgrade pip mypy
          python -m compileall -q python/ tests/ benchmarks/
          mypy --ignore-missing-imports python/http_tls/__init__.pyi

  build-wheels:
    name: Build & Test Wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC + BoringSSL)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
            test_pythons: '3.12'
          # Linux x86_64 (AlmaLinux 8 manylinux_2_28 + BoringSSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
            run_tests: true
            test_pythons: '3.9,3.12,3.14'
          # Linux aarch64 (native ARM64 runner + manylinux_2_28 + BoringSSL)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
            run_tests: true
            test_pythons: '3.12'
          # macOS Intel (cross-compiled from Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            run_tests: false
            test_pythons: ''
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
            test_pythons: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up latest stable Rust (MSRV >= 1.98 for wreq)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows BoringSSL build deps (NASM + LLVM)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm llvm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
          before-script-linux: |
            set -e
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y cmake perl-core clang clang-devel clang-libs llvm-devel git ninja-build
            elif command -v yum >/dev/null 2>&1; then
              yum install -y cmake perl-core clang clang-devel clang-libs llvm-devel git
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y cmake perl clang libclang-dev git ninja-build
            fi
            rustup update stable
            rustup default stable
            rustc --version

      - name: Run pytest test suite against built ABI3 wheel (Python 3.12)
        if: ${{ matrix.run_tests }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cryptography certifi
          python -m pip install dist/*.whl
          python -m pytest -v tests/

      - name: Verify ABI3 wheel compatibility on Python 3.13
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run pytest on Python 3.13
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest cryptography certifi
          python -m pip install dist/*.whl
          python -m pytest -v tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build Source Distribution (sdist)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
