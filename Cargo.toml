[package]
name = "http_tls"
version = "1.0.1"
edition = "2021"
description = "Rust native BoringSSL TLS & HTTP/2 browser-impersonating core for http_tls"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
wreq = { version = "0.16.4", features = [
    "webpki-roots",
    "tokio-rt",
    "hickory-dns",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "socks",
    "json",
    "form",
    "multipart",
    "stream",
    "ws",
    "charset"
] }
wreq-util = "0.2.1"
futures-util = "0.3"
bytes = "1"
encoding_rs = "0.8"
url = "2.5"
http = "1"
btls-sys = "0.5.6"
webpki-root-certs = "1.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "0.11", default-features = false }
h3 = "0.0.8"
h3-quinn = "0.0.10"
flate2 = "1"
brotli = "8"
zstd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
