[package]
name = "http_tls"
version = "0.7.0"
edition = "2021"
description = "Rust native BoringSSL TLS & HTTP/2 browser-impersonating core for http_tls"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
wreq = { version = "0.16.4", features = [
    "webpki-roots",
    "tokio-rt",
    "hickory-dns",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "socks",
    "json",
    "form",
    "multipart",
    "stream",
    "ws",
    "charset"
] }
wreq-util = "0.2.1"
futures-util = "0.3"
bytes = "1"
encoding_rs = "0.8"
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
