[package]
name = "http_tls"
version = "0.3.1"
edition = "2021"
description = "Rust native core for http_tls Python library"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "socks",
    "json",
    "http2"
] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
url = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (default) so an unexpected panic surfaces as a Python exception
# instead of aborting the interpreter.
strip = true
